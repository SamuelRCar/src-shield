# Modelo de Dependabot para projetos da SRC — copiar para .github/dependabot.yml do projeto.
# Remover os ecossistemas que o projeto não usa (senão o Dependabot registra erro de manifest).

version: 2
updates:
  # Actions dos workflows (sempre manter)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Projetos Node (remover se não houver package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Projetos Python (remover se não houver requirements.txt/pyproject.toml)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
