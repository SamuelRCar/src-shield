# SRC Shield — Workflow reutilizável de segurança (Etapa 1 do PLANO-MESTRE.md)
#
# Consumido pelos projetos da SRC via:
#   uses: SamuelRCar/src-shield/.github/workflows/security.yml@v1
# Ver docs/ci.md para instruções completas de uso e o "teste de fogo".
#
# Jobs:
#   gitleaks           — segredos vazados no código e no histórico (AT-07 / regra geral 1)
#   sast (Semgrep)     — padrões inseguros no código (A05, A01, regras OWASP)
#   sca-npm            — dependências Node com CVE conhecida (A03)
#   sca-pip            — dependências Python com CVE conhecida (A03)
#   dependency-review  — bloqueia PR que introduz dependência vulnerável (A03/A08)

name: SRC Shield Security

on:
  workflow_call:
    inputs:
      run-npm:
        description: "Rodar npm audit (projetos Node)"
        type: boolean
        default: true
      run-pip:
        description: "Rodar pip-audit (projetos Python)"
        type: boolean
        default: false
      working-directory:
        description: "Pasta do app dentro do repo (monorepos)"
        type: string
        default: "."
      audit-level:
        description: "Severidade mínima que reprova o npm audit (low|moderate|high|critical)"
        type: string
        default: "high"
      pip-requirements:
        description: "Caminho do requirements.txt (relativo a working-directory)"
        type: string
        default: "requirements.txt"
      semgrep-rules:
        description: "Regras Semgrep, separadas por espaço"
        type: string
        default: "p/owasp-top-ten p/secrets"
      dependency-review:
        description: "Rodar dependency-review em PRs (exige repo público ou GitHub Advanced Security)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: segredo commitado e depois "apagado" continua sendo achado
          fetch-depth: 0
      # CLI pinado varrendo TODO o histórico em qualquer evento.
      # (Achado do teste de fogo: a gitleaks-action v2 calcula o intervalo pelo
      # payload do evento e pulava o primeiro push de um branch novo.)
      # Config extra (allowlist) em .gitleaks.toml na raiz do repo, se existir.
      - name: Gitleaks — varredura do histórico completo
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source /repo --redact --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          set -e
          CONFIGS=""
          for r in ${{ inputs.semgrep-rules }}; do
            CONFIGS="$CONFIGS --config $r"
          done
          semgrep scan --error --metrics=off $CONFIGS

  sca-npm:
    name: Dependências Node (npm audit)
    if: ${{ inputs.run-npm }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (falha em ${{ inputs.audit-level }}+)
        run: npm audit --audit-level=${{ inputs.audit-level }}

  sca-pip:
    name: Dependências Python (pip-audit)
    if: ${{ inputs.run-pip }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (falha em qualquer CVE conhecida)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r ${{ inputs.pip-requirements }}

  dependency-review:
    name: Revisão de dependências (PRs)
    # Achado do teste de fogo: em repo PRIVADO sem GitHub Advanced Security este
    # job sempre falha — desligar via input até o repo ser público ou ter GHAS
    if: ${{ github.event_name == 'pull_request' && inputs.dependency-review }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
