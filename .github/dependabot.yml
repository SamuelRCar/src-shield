# Dependabot do repo src-shield: mantém as actions dos workflows atualizadas.
# Para projetos consumidores (com npm/pip), usar o modelo em templates/dependabot.yml.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/packages/shield"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
